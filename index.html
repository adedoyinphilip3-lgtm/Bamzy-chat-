<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bamzy Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header>
      <h1>Bamzy Chat</h1>
      <span>● Online</span>
    </header>

    <main id="messages">
      <div class="message received">
        Hello 👋
      </div>

      <div class="message sent">
        Hi! Welcome to Bamzy Chat 😎
      </div>
    </main>

    <footer>
      <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
      >

      <button onclick="sendMessage()">Send</button>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
      </html>
